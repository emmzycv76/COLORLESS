<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COLORLESS — Artist Editor</title><link rel="stylesheet" href="css/app.css"><style>
.crop-workspace{position:relative;background:#050506;border-radius:16px;overflow:hidden;margin-top:14px;touch-action:none}.crop-canvas{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain}.crop-shade{position:absolute;inset:0;background:rgba(0,0,0,.48);pointer-events:none}.crop-selection{position:absolute;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.48);cursor:move;touch-action:none}.crop-selection:before,.crop-selection:after{content:"";position:absolute;inset:33.333% 0;border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3);pointer-events:none}.crop-selection:after{inset:0 33.333%;border-top:0;border-bottom:0;border-left:1px solid rgba(255,255,255,.3);border-right:1px solid rgba(255,255,255,.3)}.crop-handle{position:absolute;width:20px;height:20px;border:2px solid #fff;background:rgba(0,0,0,.15);border-radius:5px;z-index:2}.crop-handle.tl{left:-10px;top:-10px;cursor:nwse-resize}.crop-handle.tr{right:-10px;top:-10px;cursor:nesw-resize}.crop-handle.bl{left:-10px;bottom:-10px;cursor:nesw-resize}.crop-handle.br{right:-10px;bottom:-10px;cursor:nwse-resize}.crop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.crop-status{color:#aaa;font-size:13px;margin-top:8px}.ratio-active{outline:2px solid rgba(255,255,255,.65)}
</style></head><body>
<header class="app-header"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">COLORLESS</a><div class="row"><button id="undoBtn" disabled aria-label="Undo">↶</button><button id="redoBtn" disabled aria-label="Redo">↷</button><button class="primary" id="downloadBtn">Export</button></div></header>
<main class="page"><section class="card"><div class="toolbar" aria-label="Editor tools"><button data-tool="color">🎨 Color ID</button><button data-tool="grid">▦ Grid</button><button data-tool="crop">✂️ Crop</button><button data-tool="palette">✨ Palette</button><button data-tool="value">◐ Value</button><button data-tool="simplify">◒ Simplify</button><button data-tool="reset">↺ Reset</button></div><div class="editor-stage" id="stage"><img id="editorImage" alt="Reference image"><div class="grid-layer" id="gridLayer"></div></div></section>
<section class="panel" id="colorPanel" hidden><div class="result-grid"><div class="result-item"><small>COLOR</small><div class="value-preview" id="colorPreview"></div></div><div class="result-item"><small>HEX</small><b id="hexValue">—</b><button id="copyHex">Copy</button></div><div class="result-item"><small>RGB</small><b id="rgbValue">—</b></div><div class="result-item"><small>HSL</small><b id="hslValue">—</b></div><div class="result-item"><small>NAME</small><b id="colorName">—</b></div></div><button id="saveColorBtn" class="primary">Save to palette</button></section>
<section class="panel" id="gridPanel" hidden><div class="row"><div class="control"><label>Columns <span id="colsLabel">5</span></label><input id="cols" type="range" min="2" max="20" value="5"></div><div class="control"><label>Rows <span id="rowsLabel">5</span></label><input id="rows" type="range" min="2" max="20" value="5"></div><div class="control"><label>Line opacity <span id="opacityLabel">34%</span></label><input id="gridOpacity" type="range" min="8" max="65" value="34"></div><div class="control"><label>Grid color</label><input id="gridColor" type="color" value="#ffffff"></div></div><div class="row" style="margin-top:12px"><button id="numberGrid">Number grid</button><button id="thirdsGrid">Rule of thirds</button><button id="goldenGrid">Golden ratio</button><button id="hideGrid">Hide grid</button></div></section>
<section class="panel" id="palettePanel" hidden><div class="row"><button id="extractBtn" class="primary">Extract 6 colors</button><button id="savePaletteBtn">Save palette</button></div><div class="palette" id="extractedPalette" style="margin-top:18px"></div></section>
<section class="panel" id="valuePanel" hidden><div class="row"><button id="normalView">Color</button><button id="grayView">Grayscale</button><button id="valueView">Value map</button></div><p style="color:#aaa">Use grayscale to check composition and value structure before painting.</p></section>
<section class="panel" id="simplifyPanel" hidden><div class="row"><div class="control"><label>Color groups <span id="levelsLabel">8</span></label><input id="levels" type="range" min="2" max="20" value="8"></div><button id="applySimplify" class="primary">Apply simplification</button></div></section>
<section class="panel" id="cropPanel" hidden><h3 style="margin-top:0">Crop reference</h3><p style="color:#aaa">Drag the crop area. Drag a corner to resize. The image is not changed until you press Apply crop.</p><div class="row" id="ratioButtons"><button data-ratio="free">Free</button><button data-ratio="1">1:1</button><button data-ratio="1.25">5:4</button><button data-ratio="0.8">4:5</button><button data-ratio="1.5">3:2</button><button data-ratio="1.7778">16:9</button></div><div class="crop-workspace" id="cropWorkspace"><canvas id="cropCanvas" class="crop-canvas"></canvas><div id="cropSelection" class="crop-selection"><span class="crop-handle tl"></span><span class="crop-handle tr"></span><span class="crop-handle bl"></span><span class="crop-handle br"></span></div></div><div class="crop-status" id="cropStatus">Free crop</div><div class="crop-actions"><button id="cancelCrop">Cancel</button><button id="centerCrop">Center</button><button id="applyCrop" class="primary">Apply crop</button></div></section>
<section class="panel"><h3>Saved colors</h3><div class="palette" id="savedPalette"></div></section></main><footer class="footer">COLORLESS — reference tools for artists</footer>
<script src="js/color.js"></script><script>
const img=document.getElementById('editorImage'),stage=document.getElementById('stage'),gridLayer=document.getElementById('gridLayer');const panels={color:colorPanel,grid:gridPanel,crop:cropPanel,palette:palettePanel,value:valuePanel,simplify:simplifyPanel};let original='',grid={enabled:false,cols:5,rows:5,color:'#ffffff',opacity:34,numbered:false},lastColor=null,history=[],future=[];let crop={ratio:null,x:.1,y:.1,w:.8,h:.8,active:false,drag:null};
function snapshot(){return{src:img.src,filter:img.style.filter,grid:{...grid}}}function push(){history.push(snapshot());if(history.length>40)history.shift();future=[];updateHistoryButtons()}function restore(s){img.src=s.src;img.style.filter=s.filter||'';grid={...s.grid};syncGrid();drawGrid();updateHistoryButtons()}function updateHistoryButtons(){undoBtn.disabled=history.length<=1;redoBtn.disabled=!future.length}function syncGrid(){cols.value=grid.cols;rows.value=grid.rows;colsLabel.textContent=grid.cols;gridColor.value=grid.color;gridOpacity.value=grid.opacity;opacityLabel.textContent=grid.opacity+'%'}function showPanel(name){Object.entries(panels).forEach(([k,p])=>p.hidden=k!==name);if(name==='grid'){grid.enabled=true;drawGrid()}if(name==='crop')startCrop()}
function load(){const src=localStorage.getItem('colorlessImage');if(!src){location.href='index.html';return}img.onload=()=>{original=src;history=[];push();drawGrid()};img.src=src;renderSaved()}
function drawGrid(){gridLayer.innerHTML='';if(!grid.enabled){gridLayer.style.display='none';return}gridLayer.style.display='block';const a=Math.round(grid.opacity*2.55)/255;gridLayer.style.backgroundImage=`linear-gradient(to right,rgba(${hexRgb(grid.color)},${a}) 1px,transparent 1px),linear-gradient(to bottom,rgba(${hexRgb(grid.color)},${a}) 1px,transparent 1px)`;gridLayer.style.backgroundSize=`${100/grid.cols}% ${100/grid.rows}%`;if(grid.numbered){for(let r=0;r<grid.rows;r++)for(let c=0;c<grid.cols;c++){const s=document.createElement('span');s.textContent=String.fromCharCode(65+c)+`${r+1}`;s.style.cssText=`position:absolute;left:${c*100/grid.cols+1}%;top:${r*100/grid.rows+1}%;font-size:10px;color:rgba(${hexRgb(grid.color)},.55);text-shadow:0 1px 2px #000`;gridLayer.appendChild(s)}}}function hexRgb(h){h=h.replace('#','');return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;if(t==='reset'){push();img.src=original;img.style.filter='';grid.enabled=false;drawGrid();showPanel('grid');return}showPanel(t);if(t==='color')activatePicker()});
function activatePicker(){img.style.cursor='crosshair';stage.onclick=pickColor}function pickColor(e){if(e.target!==img)return;const rect=img.getBoundingClientRect(),c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const px=Math.max(0,Math.min(c.width-1,Math.floor((e.clientX-rect.left)*c.width/rect.width))),py=Math.max(0,Math.min(c.height-1,Math.floor((e.clientY-rect.top)*c.height/rect.height)));const d=x.getImageData(px,py,1,1).data,[r,g,b]=d,h=rgbToHsl(r,g,b);lastColor={r,g,b,hex:rgbToHex(r,g,b),name:colorName(r,g,b)};colorPreview.style.background=lastColor.hex;hexValue.textContent=lastColor.hex;rgbValue.textContent=`${r}, ${g}, ${b}`;hslValue.textContent=`${h[0]}°, ${h[1]}%, ${h[2]}%`;colorName.textContent=lastColor.name;img.style.cursor='default';stage.onclick=null}
cols.oninput=()=>{grid.cols=+cols.value;colsLabel.textContent=grid.cols;drawGrid()};rows.oninput=()=>{grid.rows=+rows.value;rowsLabel.textContent=grid.rows;drawGrid()};gridColor.oninput=()=>{grid.color=gridColor.value;drawGrid()};gridOpacity.oninput=()=>{grid.opacity=+gridOpacity.value;opacityLabel.textContent=grid.opacity+'%';drawGrid()};numberGrid.onclick=()=>{grid.enabled=true;grid.numbered=true;drawGrid()};thirdsGrid.onclick=()=>{grid.enabled=true;grid.numbered=false;grid.cols=3;grid.rows=3;syncGrid();drawGrid()};goldenGrid.onclick=()=>{grid.enabled=true;grid.numbered=false;grid.cols=5;grid.rows=3;syncGrid();drawGrid()};hideGrid.onclick=()=>{grid.enabled=false;drawGrid()};
function setFilter(f){push();img.style.filter=f}normalView.onclick=()=>setFilter('none');grayView.onclick=()=>setFilter('grayscale(1)');valueView.onclick=()=>setFilter('grayscale(1) contrast(1.5)');
extractBtn.onclick=()=>{const p=extractPalette(img,6);extractedPalette.innerHTML='';p.forEach(c=>{const el=document.createElement('button');el.className='swatch';el.style.background=c.hex;el.title=`${c.name} ${c.hex}`;el.onclick=()=>{lastColor=c;colorPreview.style.background=c.hex;hexValue.textContent=c.hex;rgbValue.textContent=`${c.r}, ${c.g}, ${c.b}`;const h=rgbToHsl(c.r,c.g,c.b);hslValue.textContent=`${h[0]}°, ${h[1]}%, ${h[2]}%`;colorName.textContent=c.name;showPanel('color')};extractedPalette.appendChild(el)})};saveColorBtn.onclick=()=>{if(lastColor){saveColor(lastColor);renderSaved()}};savePaletteBtn.onclick=()=>localStorage.setItem('colorlessPalette',JSON.stringify([...extractedPalette.children].map(x=>x.title)));function renderSaved(){const a=JSON.parse(localStorage.getItem('colorlessSavedColors')||'[]');savedPalette.innerHTML=a.map(c=>`<div class="swatch" title="${c.hex}" style="background:${c.hex}"></div>`).join('')}copyHex.onclick=()=>copyText(hexValue.textContent);
levels.oninput=()=>levelsLabel.textContent=levels.value;applySimplify.onclick=()=>{push();const n=+levels.value,can=document.createElement('canvas'),ctx=can.getContext('2d');can.width=img.naturalWidth;can.height=img.naturalHeight;ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,can.width,can.height),step=255/(n-1);for(let i=0;i<d.data.length;i+=4){d.data[i]=Math.round(d.data[i]/step)*step;d.data[i+1]=Math.round(d.data[i+1]/step)*step;d.data[i+2]=Math.round(d.data[i+2]/step)*step}ctx.putImageData(d,0,0);img.src=can.toDataURL('image/jpeg',.92)};
function download(){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.filter=img.style.filter||'none';x.drawImage(img,0,0,c.width,c.height);if(grid.enabled){x.strokeStyle=`rgba(${hexRgb(grid.color)},${grid.opacity/100})`;x.lineWidth=Math.max(1,c.width/1200);for(let i=1;i<grid.cols;i++){x.beginPath();x.moveTo(c.width*i/grid.cols,0);x.lineTo(c.width*i/grid.cols,c.height);x.stroke()}for(let i=1;i<grid.rows;i++){x.beginPath();x.moveTo(0,c.height*i/grid.rows);x.lineTo(c.width,c.height*i/grid.rows);x.stroke()}}const a=document.createElement('a');a.download='colorless-reference.png';a.href=c.toDataURL('image/png');a.click()}downloadBtn.onclick=download;
undoBtn.onclick=()=>{if(history.length>1){future.push(history.pop());restore(history[history.length-1])}};redoBtn.onclick=()=>{if(future.length){history.push(future.pop());restore(history[history.length-1])}};
const cropCanvas=document.getElementById('cropCanvas'),cropCtx=cropCanvas.getContext('2d'),cropSelection=document.getElementById('cropSelection'),cropWorkspace=document.getElementById('cropWorkspace');let cropImg=new Image();function startCrop(){grid.enabled=false;drawGrid();crop.active=true;cropImg.onload=()=>{const maxW=Math.min(cropWorkspace.clientWidth,900);const scale=Math.min(1,maxW/cropImg.naturalWidth);cropCanvas.width=Math.round(cropImg.naturalWidth*scale);cropCanvas.height=Math.round(cropImg.naturalHeight*scale);cropCtx.drawImage(cropImg,0,0,cropCanvas.width,cropCanvas.height);crop.w=.8;crop.h=.8;crop.x=.1;crop.y=.1;applyCropRatio();renderCrop()};cropImg.src=img.src}function applyCropRatio(){if(!crop.ratio){renderCrop();return}const W=cropCanvas.width,H=cropCanvas.height,ar=crop.ratio;let w=crop.w,h=crop.h;if(w/h>ar)w=h*ar;else h=w/ar;w=Math.min(w,W/cropCanvas.width);h=Math.min(h,H/cropCanvas.height);crop.w=w;crop.h=h;crop.x=Math.min(crop.x,1-w);crop.y=Math.min(crop.y,1-h);renderCrop()}function renderCrop(){const W=cropCanvas.clientWidth,H=cropCanvas.clientHeight;cropSelection.style.left=(crop.x*W)+'px';cropSelection.style.top=(crop.y*H)+'px';cropSelection.style.width=(crop.w*W)+'px';cropSelection.style.height=(crop.h*H)+'px';cropStatus.textContent=crop.ratio?`Aspect ratio ${ratioLabel(crop.ratio)} · ${Math.round(crop.w*100)}% × ${Math.round(crop.h*100)}%`:'Free crop · drag or resize the selection'}function ratioLabel(r){return r===1?'1:1':r===1.25?'5:4':r===.8?'4:5':r===1.5?'3:2':r===1.7778?'16:9':'Free'}
function clampCrop(){crop.w=Math.max(.08,Math.min(crop.w,1));crop.h=Math.max(.08,Math.min(crop.h,1));crop.x=Math.max(0,Math.min(crop.x,1-crop.w));crop.y=Math.max(0,Math.min(crop.y,1-crop.h));renderCrop()};document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>{crop.ratio=b.dataset.ratio==='free'?null:+b.dataset.ratio;document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('ratio-active'));b.classList.add('ratio-active');applyCropRatio()});
function pointerStart(e){if(!crop.active)return;const target=e.target,rect=cropWorkspace.getBoundingClientRect();const sx=(e.clientX-rect.left)/rect.width,sy=(e.clientY-rect.top)/rect.height;let type=target.classList.contains('crop-handle')?'resize': 'move';let corner=target.classList.contains('tl')?'tl':target.classList.contains('tr')?'tr':target.classList.contains('bl')?'bl':target.classList.contains('br')?'br':null;crop.drag={type,corner,sx,sy,x:crop.x,y:crop.y,w:crop.w,h:crop.h};target.setPointerCapture?.(e.pointerId)}function pointerMove(e){if(!crop.drag)return;const rect=cropWorkspace.getBoundingClientRect(),sx=(e.clientX-rect.left)/rect.width,sy=(e.clientY-rect.top)/rect.height,dx=sx-crop.drag.sx,dy=sy-crop.drag.sy;if(crop.drag.type==='move'){crop.x=crop.drag.x+dx;crop.y=crop.drag.y+dy}else{let x=crop.drag.x,y=crop.drag.y,w=crop.drag.w,h=crop.drag.h;if(crop.drag.corner.includes('l')){x+=dx;w-=dx}if(crop.drag.corner.includes('r'))w+=dx;if(crop.drag.corner.includes('t')){y+=dy;h-=dy}if(crop.drag.corner.includes('b'))h+=dy;if(crop.ratio){const ar=crop.ratio;if(Math.abs(dx)>=Math.abs(dy)){h=w/ar}else{w=h*ar}if(crop.drag.corner.includes('l'))x=crop.drag.x+crop.drag.w-w;if(crop.drag.corner.includes('t'))y=crop.drag.y+crop.drag.h-h}crop.x=x;crop.y=y;crop.w=w;crop.h=h}clampCrop()};function pointerEnd(){crop.drag=null}cropSelection.addEventListener('pointerdown',pointerStart);cropWorkspace.addEventListener('pointermove',pointerMove);window.addEventListener('pointerup',pointerEnd);
centerCrop.onclick=()=>{crop.x=(1-crop.w)/2;crop.y=(1-crop.h)/2;renderCrop()};cancelCrop.onclick=()=>{crop.active=false;showPanel('grid')};applyCrop.onclick=()=>{if(!cropImg.complete)return;push();const sw=cropCanvas.width,sh=cropCanvas.height,can=document.createElement('canvas'),ctx=can.getContext('2d');const sx=Math.round(crop.x*sw),sy=Math.round(crop.y*sh),cw=Math.round(crop.w*sw),ch=Math.round(crop.h*sh),scale=img.naturalWidth/sw;can.width=Math.round(cw*scale);can.height=Math.round(ch*scale);ctx.drawImage(cropImg,sx,sy,cw,ch,0,0,can.width,can.height);img.onload=()=>{crop.active=false;showPanel('grid')};img.src=can.toDataURL('image/jpeg',.95)};
window.addEventListener('resize',()=>{drawGrid();if(crop.active)renderCrop()});load();
</script></body></html>

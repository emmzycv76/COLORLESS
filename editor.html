<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLORLESS — Artist Editor</title><link rel="stylesheet" href="css/app.css"></head><body>
<header class="app-header"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">COLORLESS</a><div class="row"><button id="undoBtn">↶</button><button id="redoBtn">↷</button><button class="primary" id="downloadBtn">Export</button></div></header>
<main class="page">
<section class="card"><div class="toolbar"><button data-tool="color">🎨 Color ID</button><button data-tool="grid">▦ Grid</button><button data-tool="crop">✂️ Crop</button><button data-tool="palette">✨ Palette</button><button data-tool="value">◐ Value</button><button data-tool="simplify">◒ Simplify</button><button data-tool="reset">↺ Reset</button></div>
<div class="editor-stage" id="stage"><img id="editorImage" alt="Reference image"><div class="grid-layer" id="gridLayer"></div></div></section>
<section class="panel" id="colorPanel" hidden><div class="result-grid"><div class="result-item"><small>COLOR</small><div class="value-preview" id="colorPreview"></div></div><div class="result-item"><small>HEX</small><b id="hexValue">—</b><button id="copyHex">Copy</button></div><div class="result-item"><small>RGB</small><b id="rgbValue">—</b></div><div class="result-item"><small>HSL</small><b id="hslValue">—</b></div><div class="result-item"><small>NAME</small><b id="colorName">—</b></div></div><button id="saveColorBtn" class="primary">Save to palette</button></section>
<section class="panel" id="gridPanel" hidden><div class="row"><div class="control"><label>Columns <span id="colsLabel">5</span></label><input id="cols" type="range" min="2" max="20" value="5"></div><div class="control"><label>Rows <span id="rowsLabel">5</span></label><input id="rows" type="range" min="2" max="20" value="5"></div><div class="control"><label>Grid color</label><input id="gridColor" type="color" value="#ffffff"></div></div><div class="row" style="margin-top:12px"><button id="numberGrid">Number grid</button><button id="thirdsGrid">Rule of thirds</button><button id="goldenGrid">Golden ratio</button><button id="hideGrid">Hide grid</button></div></section>
<section class="panel" id="palettePanel" hidden><div class="row"><button id="extractBtn" class="primary">Extract 6 colors</button><button id="savePaletteBtn">Save palette</button></div><div class="palette" id="extractedPalette" style="margin-top:18px"></div></section>
<section class="panel" id="valuePanel" hidden><div class="row"><button id="normalView">Color</button><button id="grayView">Grayscale</button><button id="valueView">Value map</button></div><p style="color:#aaa">Use grayscale to check composition and value structure before painting.</p></section>
<section class="panel" id="simplifyPanel" hidden><div class="row"><div class="control"><label>Color groups <span id="levelsLabel">8</span></label><input id="levels" type="range" min="2" max="20" value="8"></div><button id="applySimplify" class="primary">Apply simplification</button></div></section>
<section class="panel" id="cropPanel" hidden><p>Choose an aspect ratio, then crop the reference.</p><div class="row"><button data-ratio="free">Free</button><button data-ratio="1">1:1</button><button data-ratio="1.25">5:4</button><button data-ratio="0.8">4:5</button><button data-ratio="1.5">3:2</button><button data-ratio="1.7778">16:9</button></div><div id="cropBox" style="margin-top:14px"></div></section>
<section class="panel"><h3>Saved colors</h3><div class="palette" id="savedPalette"></div></section>
</main><footer class="footer">COLORLESS — reference tools for artists</footer>
<script src="js/color.js"></script><script>
const img=document.getElementById('editorImage'),stage=document.getElementById('stage'),gridLayer=document.getElementById('gridLayer');let original='',mode='normal',grid={cols:5,rows:5,color:'#ffffff',numbered:false},lastColor=null,history=[],future=[];const panels={color:colorPanel,grid:gridPanel,crop:cropPanel,palette:palettePanel,value:valuePanel,simplify:simplifyPanel};
function snapshot(){return {src:img.src,filter:img.style.filter,grid:{...grid}}} function push(){history.push(snapshot());if(history.length>30)history.shift();future=[]} function restore(s){img.src=s.src;img.style.filter=s.filter;grid={...s.grid};syncGrid();drawGrid()} function syncGrid(){cols.value=grid.cols;rows.value=grid.rows;colsLabel.textContent=grid.cols;rowsLabel.textContent=grid.rows;gridColor.value=grid.color} function showPanel(name){Object.entries(panels).forEach(([k,p])=>p.hidden=k!==name);if(name==='grid')drawGrid();}
function load(){const src=localStorage.getItem('colorlessImage');if(!src){location.href='index.html';return}img.src=src;img.onload=()=>{original=src;push();drawGrid()};renderSaved()}
function drawGrid(){gridLayer.innerHTML='';if(!grid.enabled)return;gridLayer.style.display='block';gridLayer.style.backgroundImage=`linear-gradient(to right,${grid.color} 1px,transparent 1px),linear-gradient(to bottom,${grid.color} 1px,transparent 1px)`;gridLayer.style.backgroundSize=`${100/grid.cols}% ${100/grid.rows}%`;if(grid.numbered){for(let r=0;r<grid.rows;r++)for(let c=0;c<grid.cols;c++){const s=document.createElement('span');s.textContent=String.fromCharCode(65+c)+`${r+1}`;s.style.cssText=`position:absolute;left:${c*100/grid.cols+1}%;top:${r*100/grid.rows+1}%;font-size:10px;color:${grid.color};text-shadow:0 1px 2px #000`;gridLayer.appendChild(s)}}else gridLayer.style.display=grid.enabled?'block':'none'}
function closeGrid(){grid.enabled=false;drawGrid()} function openTool(t){showPanel(t);if(t==='grid'){grid.enabled=true;drawGrid()}}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;if(t==='reset'){push();img.src=original;img.style.filter='';mode='normal';grid.enabled=false;drawGrid();return}openTool(t);if(t==='color')activatePicker()});
function activatePicker(){img.style.cursor='crosshair';stage.onclick=pickColor}function pickColor(e){const rect=img.getBoundingClientRect();if(e.target!==img)return;const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const px=Math.max(0,Math.min(c.width-1,Math.floor((e.clientX-rect.left)*c.width/rect.width))),py=Math.max(0,Math.min(c.height-1,Math.floor((e.clientY-rect.top)*c.height/rect.height)));const d=x.getImageData(px,py,1,1).data,[r,g,b]=d;const hex=rgbToHex(r,g,b),h=rgbToHsl(r,g,b);lastColor={r,g,b,hex,name:colorName(r,g,b)};colorPreview.style.background=hex;hexValue.textContent=hex;rgbValue.textContent=`${r}, ${g}, ${b}`;hslValue.textContent=`${h[0]}°, ${h[1]}%, ${h[2]}%`;colorName.textContent=lastColor.name;img.style.cursor='default';stage.onclick=null}
cols.oninput=()=>{grid.cols=+cols.value;colsLabel.textContent=grid.cols;drawGrid()};rows.oninput=()=>{grid.rows=+rows.value;rowsLabel.textContent=grid.rows;drawGrid()};gridColor.oninput=()=>{grid.color=gridColor.value;drawGrid()};numberGrid.onclick=()=>{grid.enabled=true;grid.numbered=true;drawGrid()};thirdsGrid.onclick=()=>{grid.enabled=true;grid.numbered=false;grid.cols=3;grid.rows=3;syncGrid();drawGrid()};goldenGrid.onclick=()=>{grid.enabled=true;grid.numbered=false;grid.cols=5;grid.rows=3;syncGrid();drawGrid()};hideGrid.onclick=closeGrid;
function setFilter(f){push();img.style.filter=f;mode=f==='none'?'normal':f}normalView.onclick=()=>setFilter('none');grayView.onclick=()=>setFilter('grayscale(1)');valueView.onclick=()=>setFilter('grayscale(1) contrast(1.5)');
extractBtn.onclick=()=>{const p=extractPalette(img,6);extractedPalette.innerHTML='';p.forEach(c=>{const el=document.createElement('button');el.className='swatch';el.style.background=c.hex;el.title=`${c.name} ${c.hex}`;el.onclick=()=>{lastColor=c;colorPreview.style.background=c.hex;hexValue.textContent=c.hex;rgbValue.textContent=`${c.r}, ${c.g}, ${c.b}`;const h=rgbToHsl(c.r,c.g,c.b);hslValue.textContent=`${h[0]}°, ${h[1]}%, ${h[2]}%`;colorName.textContent=c.name;showPanel('color')};extractedPalette.appendChild(el)})};saveColorBtn.onclick=()=>{if(lastColor){saveColor(lastColor);renderSaved()}};savePaletteBtn.onclick=()=>{const p=[...extractedPalette.children].map(x=>x.title);localStorage.setItem('colorlessPalette',JSON.stringify(p))};function renderSaved(){const a=JSON.parse(localStorage.getItem('colorlessSavedColors')||'[]');savedPalette.innerHTML=a.map(c=>`<div class="swatch" title="${c.hex}" style="background:${c.hex}"></div>`).join('')};copyHex.onclick=()=>copyText(hexValue.textContent);
levels.oninput=()=>levelsLabel.textContent=levels.value;applySimplify.onclick=()=>{push();const n=+levels.value;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,canvas.width,canvas.height),step=255/(n-1);for(let i=0;i<d.data.length;i+=4){d.data[i]=Math.round(d.data[i]/step)*step;d.data[i+1]=Math.round(d.data[i+1]/step)*step;d.data[i+2]=Math.round(d.data[i+2]/step)*step}ctx.putImageData(d,0,0);img.src=canvas.toDataURL('image/jpeg',.92)};
function download(){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.filter=img.style.filter||'none';x.drawImage(img,0,0,c.width,c.height);if(grid.enabled){x.strokeStyle=grid.color;x.lineWidth=Math.max(1,c.width/800);for(let i=1;i<grid.cols;i++){x.beginPath();x.moveTo(c.width*i/grid.cols,0);x.lineTo(c.width*i/grid.cols,c.height);x.stroke()}for(let i=1;i<grid.rows;i++){x.beginPath();x.moveTo(0,c.height*i/grid.rows);x.lineTo(c.width,c.height*i/grid.rows);x.stroke()}}const a=document.createElement('a');a.download='colorless-reference.png';a.href=c.toDataURL('image/png');a.click()}downloadBtn.onclick=download;
undoBtn.onclick=()=>{if(history.length>1){future.push(history.pop());restore(history[history.length-1])}};redoBtn.onclick=()=>{if(future.length){const s=future.pop();history.push(s);restore(s)}};window.addEventListener('resize',drawGrid);load();
</script></body></html>

name: Patch V2 editor UI

on:
  push:
    branches: [colorless-v2]

permissions:
  contents: write

jobs:
  patch-editor:
    if: ${{ !contains(github.event.head_commit.message, 'V2 editor UI patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: colorless-v2

      - name: Patch editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('editor.html')
          s=p.read_text()
          old='<header class="app-header"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">COLORLESS</a><div class="row"><button id="undoBtn" disabled aria-label="Undo">↶</button><button id="redoBtn" disabled aria-label="Redo">↷</button><button class="primary" id="downloadBtn">Export</button></div></header>'
          new='<header class="app-header"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">COLORLESS</a><div class="row"><a class="editor-nav" href="index.html" aria-label="Back to Home" title="Back to Home">←</a><a class="editor-nav" href="about.html" aria-label="About COLORLESS" title="About">ⓘ</a><button id="undoBtn" disabled aria-label="Undo">↶</button><button id="redoBtn" disabled aria-label="Redo">↷</button><button class="primary" id="downloadBtn">Export</button></div></header>'
          if old in s: s=s.replace(old,new,1)
          s=s.replace('<button id="toolbarExport">Export</button>','',1)
          css='''\n<style id="v2-editor-ui">\n.editor-nav{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:38px;padding:0 9px;border-radius:10px;color:inherit;text-decoration:none}\n#toolGuide{margin:2px 2px 10px;padding:4px 2px;color:#8f8f95;font-size:12px;line-height:1.35;min-height:31px}\n#toolGuide strong{display:block;color:#c8c8cc;font-weight:600}\n#toolGuide span{display:block}\n</style>\n'''
          if 'id="v2-editor-ui"' not in s: s=s.replace('</head>',css+'</head>',1)
          guide='<div id="toolGuide"><strong>Choose a tool</strong><span>Learn what each COLORLESS tool helps you do.</span></div>'
          if 'id="toolGuide"' not in s: s=s.replace('</div><div class="editor-stage" id="stage">','</div>'+guide+'<div class="editor-stage" id="stage">',1)
          ui_js='''\n<script id="v2-editor-ui-js">\n(function(){\n const guide=document.getElementById('toolGuide');\n const descriptions={color:['Color ID','Pick a point in your reference to study its exact color.'],grid:['Grid','Use a grid to transfer proportions and placement accurately.'],crop:['Crop','Frame your reference to match your canvas or improve the composition.'],palette:['Palette','Extract key colors and study their relationships before painting.'],value:['Value','Study light, midtones, and shadows without relying on color.'],simplify:['Simplify','Reduce detail into larger shapes so the main forms are easier to see.'],reset:['Reset','Return the reference to its starting state.']};\n document.querySelectorAll('.toolbar [data-tool]').forEach(b=>b.addEventListener('click',()=>{const d=descriptions[b.dataset.tool];if(d)guide.innerHTML='<strong>'+d[0]+'</strong><span>'+d[1]+'</span>'}));\n const layer=document.getElementById('gridLayer');\n if(layer){new MutationObserver(()=>{[...layer.querySelectorAll('span')].forEach(el=>{const m=el.textContent.match(/^([A-Z])(\\d+)$/);if(!m)return;const col=m[1].charCodeAt(0)-64,row=+m[2];if(col>1&&row>1)el.remove();else el.textContent=row===1?m[1]:String(row)})}).observe(layer,{childList:true});}\n})();\n</script>\n'''
          if 'id="v2-editor-ui-js"' not in s: s=s.replace('</body>',ui_js+'</body>',1)
          replacement='''function download(){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.filter=img.style.filter||'none';x.drawImage(img,0,0,c.width,c.height);if(grid.enabled){const lineAlpha=grid.opacity/100;x.strokeStyle=`rgba(${hexRgb(grid.color)},${lineAlpha})`;x.fillStyle=`rgba(${hexRgb(grid.color)},.75)`;x.lineWidth=Math.max(1,c.width/1200);for(let i=1;i<grid.cols;i++){x.beginPath();x.moveTo(c.width*i/grid.cols,0);x.lineTo(c.width*i/grid.cols,c.height);x.stroke()}for(let i=1;i<grid.rows;i++){x.beginPath();x.moveTo(0,c.height*i/grid.rows);x.lineTo(c.width,c.height*i/grid.rows);x.stroke()}if(grid.numbered){const fs=Math.max(12,Math.round(c.width/90));x.font=`600 ${fs}px sans-serif`;x.textAlign='left';x.textBaseline='top';x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=3;for(let col=0;col<grid.cols;col++)x.fillText(String.fromCharCode(65+col),Math.round(c.width*col/grid.cols+6),6);for(let row=0;row<grid.rows;row++)x.fillText(String(row+1),6,Math.round(c.height*row/grid.rows+6));x.shadowBlur=0}}const a=document.createElement('a');a.download='colorless-reference.png';a.href=c.toDataURL('image/png');a.click()}downloadBtn.onclick=download;toolbarExport?.addEventListener?.('click',download);'''
          s,n=re.subn(r'function download\(\)\{.*?downloadBtn\.onclick=download;toolbarExport\.onclick=download;',replacement,s,count=1,flags=re.S)
          p.write_text(s)
          print('patched',n)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor.html
          git diff --cached --quiet && exit 0
          git commit -m "V2 editor UI patch"
          git push origin colorless-v2

<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COLORLESS Crop + Grid Test</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f5;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:14px}.top{position:sticky;top:0;background:#111115;padding:12px 0;z-index:5}h1{font-size:20px;margin:0 0 8px}.tools{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.tools button{white-space:nowrap;flex:0 0 auto}button{border:0;border-radius:12px;padding:10px 13px;background:#27272d;color:#fff}button.primary{background:#ff4d4d}input{accent-color:#ff4d4d}.card{background:#17171b;border:1px solid #29292e;border-radius:18px;padding:12px;margin-top:12px}.stage{position:relative;min-height:55vh;background:#050506;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{max-width:100%;max-height:65vh;display:block}.grid{position:absolute;inset:0;pointer-events:none}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls label{font-size:12px;color:#aaa;display:flex;flex-direction:column;gap:5px}.crop{position:fixed;inset:0;background:#050507;z-index:20;padding:10px;display:none;flex-direction:column}.cropbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px}.cropframe{position:relative;flex:1;min-height:0;background:#111;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}.cropframe img{max-width:100%;max-height:100%;display:block}.box{position:absolute;border:1px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);touch-action:none}.handle{position:absolute;width:20px;height:20px;background:#111;border:2px solid #fff;border-radius:50%}.nw{left:-10px;top:-10px}.ne{right:-10px;top:-10px}.sw{left:-10px;bottom:-10px}.se{right:-10px;bottom:-10px}.cropfoot{display:flex;gap:8px;padding-top:10px}.cropfoot button{flex:1}@media(max-width:600px){main{padding:8px}.stage{min-height:52vh}}</style><main><div class="top"><h1>COLORLESS — Crop + Grid Test</h1><input id="file" type="file" accept="image/*"></div><div class="tools"><button id="gridBtn">▦ Grid</button><button id="cropBtn">✂ Crop</button><button id="hideBtn">Hide grid</button></div><div class="card"><div class="stage"><img id="img" hidden><div id="empty">Upload an image to begin</div><div class="grid" id="grid"></div></div></div><div class="card"><div class="controls"><label>Columns <b id="cl">5</b><input id="cols" type="range" min="2" max="20" value="5"></label><label>Rows <b id="rl">5</b><input id="rows" type="range" min="2" max="20" value="5"></label><label>Opacity <b id="ol">22%</b><input id="opacity" type="range" min="5" max="50" value="22"></label></div></div></main><section class="crop" id="crop"><div class="cropbar"><button data-r="free">Free</button><button data-r="1">1:1</button><button data-r="1.25">5:4</button><button data-r=".8">4:5</button><button data-r="1.5">3:2</button><button data-r="1.7778">16:9</button></div><div class="cropframe" id="frame"><img id="cimg"></div><div class="cropfoot"><button id="cancel">Cancel</button><button id="center">Center</button><button class="primary" id="apply">Apply crop</button></div></section><script>const $=id=>document.getElementById(id),file=$('file'),img=$('img'),empty=$('empty'),grid=$('grid');let src='',cols=5,rows=5,opacity=22,shown=false;file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{src=r.result;img.src=src;img.hidden=false;empty.hidden=true;draw()};r.readAsDataURL(f)};function draw(){grid.style.backgroundImage=`linear-gradient(to right,rgba(255,255,255,${opacity/100}) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,${opacity/100}) 1px,transparent 1px)`;grid.style.backgroundSize=`${100/cols}% ${100/rows}%`;grid.style.display=shown?'block':'none'}$('gridBtn').onclick=()=>{shown=true;draw()};$('hideBtn').onclick=()=>{shown=false;draw()};$('cols').oninput=e=>{cols=+e.target.value;$('cl').textContent=cols;draw()};$('rows').oninput=e=>{rows=+e.target.value;$('rl').textContent=rows;draw()};$('opacity').oninput=e=>{opacity=+e.target.value;$('ol').textContent=opacity+'%';draw()};const crop=$('crop'),cimg=$('cimg'),frame=$('frame');let box=null,ratio=null,mode=null,start=null,boxEl=null;function openCrop(){if(!src){file.click();return}crop.style.display='flex';cimg.src=src;cimg.onload=()=>{box={x:.1,y:.1,w:.8,h:.8};render()}}$('cropBtn').onclick=openCrop;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ratio=b.dataset.r==='free'?null:+b.dataset.r;resizeRatio()});function addBox(){if(boxEl)return;boxEl=document.createElement('div');boxEl.className='box';['nw','ne','sw','se'].forEach(n=>{const h=document.createElement('span');h.className='handle '+n;h.dataset.h=n;boxEl.append(h)});frame.append(boxEl);boxEl.onpointerdown=e=>{e.preventDefault();mode=e.target.dataset.h||'move';start={x:e.clientX,y:e.clientY,b:{...box}};boxEl.setPointerCapture(e.pointerId)};boxEl.onpointermove=e=>{if(!mode)return;let dx=(e.clientX-start.x)/cimg.clientWidth,dy=(e.clientY-start.y)/cimg.clientHeight,b=start.b;if(mode==='move'){box.x=Math.max(0,Math.min(1-b.w,b.x+dx));box.y=Math.max(0,Math.min(1-b.h,b.y+dy))}else{let x=b.x,y=b.y,w=b.w,h=b.h;if(mode.includes('e'))w=Math.max(.05,Math.min(1-x,x+w+dx));if(mode.includes('s'))h=Math.max(.05,Math.min(1-y,y+h+dy));if(mode.includes('w')){x=Math.max(0,Math.min(b.x+b.w-.05,b.x+dx));w=b.x+b.w-x}if(mode.includes('n')){y=Math.max(0,Math.min(b.y+b.h-.05,b.y+dy));h=b.y+b.h-y}if(ratio){if(w/h>ratio)w=h*ratio;else h=w/ratio;if(mode.includes('w'))x=b.x+b.w-w;if(mode.includes('n'))y=b.y+b.h-h;x=Math.max(0,Math.min(1-w,x));y=Math.max(0,Math.min(1-h,y))}box={x,y,w,h}}render()};boxEl.onpointerup=()=>mode=null}function render(){if(!box)return;if(!boxEl)addBox();const w=frame.clientWidth,h=frame.clientHeight,iw=cimg.clientWidth,ih=cimg.clientHeight,left=(w-iw)/2,top=(h-ih)/2;boxEl.style.left=left+box.x*iw+'px';boxEl.style.top=top+box.y*ih+'px';boxEl.style.width=box.w*iw+'px';boxEl.style.height=box.h*ih+'px'}function resizeRatio(){if(!ratio)return render();const iw=cimg.clientWidth,ih=cimg.clientHeight;let w=box.w,h=w*iw/(ratio*ih);if(h>.8){h=.8;w=h*ratio*ih/iw}box.w=w;box.h=h;box.x=(1-w)/2;box.y=(1-h)/2;render()}$('cancel').onclick=()=>crop.style.display='none';$('center').onclick=()=>{box.x=(1-box.w)/2;box.y=(1-box.h)/2;render()};$('apply').onclick=()=>{const iw=cimg.naturalWidth,ih=cimg.naturalHeight,x=box.x*iw,y=box.y*ih,w=box.w*iw,h=box.h*ih,can=document.createElement('canvas');can.width=Math.round(w);can.height=Math.round(h);can.getContext('2d').drawImage(cimg,x,y,w,h,0,0,w,h);src=can.toDataURL('image/jpeg',.92);img.src=src;crop.style.display='none';shown=false;draw()};window.onresize=render</script>

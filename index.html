<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLORLESS — Artist Reference</title><link rel="stylesheet" href="css/app.css"></head><body><header class="app-header"><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><img src="IMG_5615.jpeg" alt="">COLORLESS</a><button onclick="location.href='about.html'">About</button></header><main class="page"><section class="hero"><h1>Turn photos into painting guides.</h1><p>Identify colors, extract palettes, check values, simplify references and build a precise drawing grid.</p><label class="upload"><input id="file" type="file" accept="image/*">📷 Upload a reference photo</label></section><section class="card"><h2>Quick tools</h2><div class="row"><button class="primary" onclick="pick()">Open Editor</button><button onclick="demoPalette()">🎨 Try the editor</button></div><p style="color:#aaa">Your photo stays in your browser while you work.</p></section><div style="text-align:center;margin:28px 0 8px"><a href="https://formspree.io/f/xjgqpqav" target="_blank" rel="noopener" style="display:inline-block;padding:9px 16px;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:#aaa;text-decoration:none;font-size:13px">💬 Feedback</a></div><footer class="footer">© 2026 COLORLESS · Made for artists worldwide.</footer></main><script>const f=document.querySelector('#file');function pick(){if(!f.files[0]){f.click();return}openEditor()}f.onchange=openEditor;function openEditor(){const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{localStorage.setItem('colorlessImage',r.result);location.href='editor.html'};r.readAsDataURL(file)}function demoPalette(){alert('Upload a reference photo first, then use Palette in the editor.');f.click()}</script></body></html>

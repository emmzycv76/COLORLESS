<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLORLESS — Artist Reference</title>
<link rel="stylesheet" href="css/app.css">
<style>
.mixer-card,.recent-card{max-width:620px;margin:18px auto}
.mixer-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}
.mixer-body{display:none;margin-top:10px}.mixer-body.open{display:block}
.recent-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.recent-head h2{font-size:16px;margin:0}.recent-actions{display:flex;gap:6px}.recent-actions button{font-size:12px;padding:7px 10px}
.recent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.recent-item{position:relative;border:1px solid #29292e;border-radius:14px;overflow:hidden;background:#17171b;padding:0;color:inherit;text-align:left}
.recent-thumb{position:relative}.recent-item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.recent-open{position:absolute;left:9px;bottom:9px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:6px 9px;font-size:12px}
.recent-meta{padding:9px 10px 10px}.recent-title{display:block;font-size:13px;font-weight:600}.recent-time{display:block;padding-top:3px;color:#888;font-size:11px}
.recent-delete{position:absolute;right:8px;top:8px;width:30px;height:30px;padding:0;border-radius:50%;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:14px;z-index:2}
.recent-empty{color:#888;font-size:13px;padding:12px 2px}.recent-error{color:#ff9a9a;font-size:13px;padding:12px 2px}
.feedback-wrap{max-width:620px;margin:30px auto 8px;text-align:left}.feedback-wrap h2{text-align:center;font-size:16px;margin:0 0 6px}.feedback-wrap>p{text-align:center;color:#888;font-size:12px;margin:0 0 12px}
.feedback-form{background:#17171b;border:1px solid #29292e;border-radius:18px;padding:14px}.feedback-form textarea{box-sizing:border-box;width:100%;min-height:120px;resize:vertical;background:#0f0f12;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;outline:none}.feedback-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}.feedback-status{font-size:12px;color:#888;margin-right:auto}.feedback-status.success{color:#aaa}.feedback-status.error{color:#ff8b8b}.feedback-form button{min-width:82px}
.mixer-swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.mixer-swatch{width:42px;height:42px;border-radius:10px;border:2px solid #fff;cursor:pointer}.mix-result{min-height:80px;text-align:center;padding:12px}.mix-result .mixer-swatch{width:90px;height:90px;margin:auto}
.about-icon{width:38px;height:38px;padding:0;border-radius:50%;font-size:19px;margin:0}
@media(max-width:520px){.recent-grid{grid-template-columns:1fr 1fr;gap:9px}.recent-meta{padding:8px}.recent-open{font-size:11px;padding:5px 7px}}
</style>
</head>
<body>
<header class="app-header"><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><img src="IMG_5615.jpeg" alt="">COLORLESS</a><button class="about-icon" aria-label="About COLORLESS" title="About" onclick="location.href='about.html'">ⓘ</button></header>
<main class="page">
<section class="hero"><h1>Turn photos into painting guides.</h1><label class="upload"><input id="file" type="file" accept="image/*">📷 Upload a reference photo</label></section>
<section class="card recent-card"><div class="recent-head"><h2>Recent projects</h2><div class="recent-actions"><button id="clearRecent" type="button" hidden>Clear all</button></div></div><div class="recent-grid" id="recentProjects"></div></section>
<section class="card mixer-card"><button class="mixer-toggle" id="mixerToggle" type="button"><span>🎨 Color Mixer<br><small style="color:#888">Experiment with colors before painting.</small></span><span id="mixerChevron">▾</span></button><div class="mixer-body" id="mixerBody"><div class="mixer-swatches" id="mixerPalette"></div><div class="mix-result" id="mixResult"><span style="color:#888">Tap swatches to mix colors</span></div><button type="button" onclick="clearMix()">Clear Mixer</button></div></section>
<div class="feedback-wrap"><h2>Feedback</h2><p>Tell us what you think or what we can improve.</p><form class="feedback-form" id="feedbackForm" action="https://formspree.io/f/xjgqpqav" method="POST"><textarea id="feedbackMessage" name="message" placeholder="Write your feedback..." required></textarea><div class="feedback-actions"><span class="feedback-status" id="feedbackStatus" aria-live="polite"></span><button type="submit" class="primary" id="feedbackSend">Send</button></div></form></div>
<footer class="footer">© 2026 COLORLESS · Made for artists worldwide.</footer>
</main>
<script>
const f=document.querySelector('#file');
const MAX_RECENTS=4,MAX_EDGE=1800;
function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function compressImage(src){return new Promise(resolve=>{const im=new Image();im.onload=()=>{if(Math.max(im.naturalWidth,im.naturalHeight)<=MAX_EDGE&&src.length<1200000){resolve(src);return}const scale=Math.min(1,MAX_EDGE/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=()=>resolve(src);im.src=src})}
function getRecent(){try{const a=JSON.parse(localStorage.getItem('colorlessRecentProjects')||'[]');return Array.isArray(a)?a.filter(x=>x&&x.src):[]}catch(e){return[]}}
function writeRecent(a){for(let n=a.length;n>0;n--){try{localStorage.setItem('colorlessRecentProjects',JSON.stringify(a.slice(0,n)));return true}catch(e){try{localStorage.removeItem('colorlessRecentProjects')}catch(_){} }}return false}
function saveRecent(src){let a=getRecent().filter(x=>x.src!==src);a=[{src,time:Date.now()},...a].slice(0,MAX_RECENTS);if(!writeRecent(a)){try{localStorage.setItem('colorlessRecentProjects',JSON.stringify([{src,time:Date.now()}]))}catch(e){}}}
async function openEditor(){const file=f.files&&f.files[0];if(!file)return;try{f.disabled=true;const raw=await readImage(file);const src=await compressImage(raw);try{localStorage.setItem('colorlessImage',src)}catch(e){localStorage.removeItem('colorlessImage');saveRecent(src);localStorage.setItem('colorlessImage',src)}saveRecent(src);location.assign('editor.html')}catch(e){alert('This image could not be loaded. Please try another image.')}finally{f.disabled=false}}
f.addEventListener('change',openEditor);
function timeAgo(t){const d=Math.max(0,Date.now()-Number(t||0)),m=Math.floor(d/60000),h=Math.floor(d/3600000),days=Math.floor(d/86400000);if(m<1)return'Just now';if(m<60)return m+' min ago';if(h<24)return h+' hr ago';if(days<7)return days+' day'+(days===1?'':'s')+' ago';return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function renderRecent(){const box=document.querySelector('#recentProjects'),clear=document.querySelector('#clearRecent');const a=getRecent();if(!a.length){box.innerHTML='<div class="recent-empty">Your recent references will appear here after you upload one.</div>';clear.hidden=true;return}clear.hidden=false;box.innerHTML=a.map((p,i)=>`<article class="recent-item"><button class="recent-delete" type="button" aria-label="Delete project ${i+1}" onclick="deleteRecent(event,${i})">×</button><button type="button" style="display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left" onclick="openRecent(${i})"><div class="recent-thumb"><img src="${p.src}" alt="Recent project ${i+1}"><span class="recent-open">Open project</span></div><div class="recent-meta"><span class="recent-title">Reference ${i+1}</span><span class="recent-time">${timeAgo(p.time)}</span></div></button></article>`).join('')}
function openRecent(i){const a=getRecent();if(!a[i])return;try{localStorage.setItem('colorlessImage',a[i].src)}catch(e){alert('This project is too large for this browser storage. Please upload the image again.');return}a[i].time=Date.now();writeRecent(a);location.assign('editor.html')}
function deleteRecent(e,i){e.stopPropagation();const a=getRecent();a.splice(i,1);writeRecent(a);renderRecent()}
document.querySelector('#clearRecent').onclick=()=>{if(confirm('Clear all recent projects?')){localStorage.removeItem('colorlessRecentProjects');renderRecent()}};renderRecent();setInterval(renderRecent,60000);
const mixerToggle=document.querySelector('#mixerToggle'),mixerBody=document.querySelector('#mixerBody'),mixerChevron=document.querySelector('#mixerChevron');mixerToggle.onclick=()=>{mixerBody.classList.toggle('open');mixerChevron.textContent=mixerBody.classList.contains('open')?'▴':'▾'};
let picked=[];const colors=['#FF0000','#E30000','#FFFF00','#FF7F00','#00FF00','#0000FF','#3F00FF','#800080','#FF69B4','#8B4513','#000000','#FFFFFF','#808080'];const palette=document.querySelector('#mixerPalette');colors.forEach(hex=>{const s=document.createElement('button');s.type='button';s.className='mixer-swatch';s.style.background=hex;s.setAttribute('aria-label','Mix '+hex);s.onclick=()=>addMix(hex);palette.appendChild(s)});function addMix(hex){picked.push(hex);if(picked.length>8)picked.shift();const rgb=picked.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);const avg=rgb.reduce((a,v)=>a.map((x,i)=>x+v[i]),[0,0,0]).map(v=>Math.round(v/rgb.length));const mixed='#'+avg.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();document.querySelector('#mixResult').innerHTML='<div class="mixer-swatch" style="background:'+mixed+'"></div><strong>'+mixed+'</strong>'}function clearMix(){picked=[];document.querySelector('#mixResult').innerHTML='<span style="color:#888">Tap swatches to mix colors</span>'}
const feedbackForm=document.querySelector('#feedbackForm'),feedbackMessage=document.querySelector('#feedbackMessage'),feedbackSend=document.querySelector('#feedbackSend'),feedbackStatus=document.querySelector('#feedbackStatus');feedbackForm.addEventListener('submit',async e=>{e.preventDefault();if(!feedbackMessage.value.trim())return;feedbackSend.disabled=true;feedbackStatus.textContent='Sending…';feedbackStatus.className='feedback-status';try{const response=await fetch(feedbackForm.action,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({message:feedbackMessage.value.trim()})});if(!response.ok)throw new Error();feedbackMessage.value='';feedbackStatus.textContent='Sent ✓';feedbackStatus.className='feedback-status success'}catch(error){feedbackStatus.textContent='Couldn’t send. Please try again.';feedbackStatus.className='feedback-status error'}finally{feedbackSend.disabled=false}});
</script>
</body>
</html>

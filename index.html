<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLORLESS — Artist Reference</title><link rel="stylesheet" href="css/app.css"></head><body><header class="app-header"><div class="brand"><img src="IMG_5615.jpeg" alt="">COLORLESS</div><button onclick="location.href='about.html'">About</button></header><main class="page"><section class="hero"><h1>Turn photos into painting guides.</h1><p>Identify colors, extract palettes, check values, simplify references and build a precise drawing grid.</p><label class="upload"><input id="file" type="file" accept="image/*">📷 Upload a reference photo</label></section><section class="card"><h2>Quick tools</h2><div class="row"><button class="primary" onclick="pick()">Open Editor</button><button onclick="demoPalette()">🎨 Color Mixer</button></div><p style="color:#aaa">Your photo stays in your browser while you work.</p></section><footer class="footer">© 2026 COLORLESS · Made for artists worldwide.</footer></main><script>const f=document.querySelector('#file');function pick(){if(!f.files[0]){f.click();return}openEditor()}f.onchange=openEditor;function openEditor(){const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{localStorage.setItem('colorlessImage',r.result);location.href='editor-v2.html'};r.readAsDataURL(file)}function demoPalette(){location.href='editor-v2.html'}</script></body></html>

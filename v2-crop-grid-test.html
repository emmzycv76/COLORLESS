<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COLORLESS V2 — Crop & Grid Test</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f4f4f5;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.tools{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:8px 0;scrollbar-width:none}.tools button,.controls button{flex:0 0 auto;background:#24242a;color:#fff;border:1px solid #38383f;border-radius:12px;padding:10px 14px}.primary{background:#e94343!important}.card{background:#17171b;border:1px solid #2a2a30;border-radius:18px;padding:14px}.stage{position:relative;background:#050506;border-radius:14px;min-height:45vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{display:block;max-width:100%;max-height:65vh;object-fit:contain}.grid{position:absolute;inset:0;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.controls label{display:flex;align-items:center;gap:6px;background:#1f1f24;border-radius:10px;padding:8px 10px;color:#ccc}.controls input{max-width:120px}.crop{position:relative;display:none;margin-top:12px;background:#050506;border-radius:14px;overflow:hidden;touch-action:none}.crop canvas{display:block;width:100%;height:auto}.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);pointer-events:none}.sel{position:absolute;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.45);touch-action:none}.sel i{position:absolute;width:22px;height:22px;border:2px solid #fff;border-radius:5px;background:#111}.tl{left:-11px;top:-11px}.tr{right:-11px;top:-11px}.bl{left:-11px;bottom:-11px}.br{right:-11px;bottom:-11px}.cropbar{display:flex;gap:8px;overflow-x:auto;padding:10px 0;white-space:nowrap}.status{color:#aaa;margin-top:6px}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="top"><strong>COLORLESS V2 TEST</strong><label class="primary" style="padding:10px 14px;border-radius:12px;cursor:pointer">Upload<input id="file" type="file" accept="image/*" hidden></label></div><div class="tools"><button id="gridBtn">▦ Grid</button><button id="cropBtn">✂ Crop</button><button id="resetBtn">↺ Reset</button></div><div class="card"><div class="stage" id="stage"><img id="img" alt="Upload an image"><div class="grid" id="grid"></div></div><div class="controls" id="gridControls"><label>Columns <input id="cols" type="range" min="2" max="20" value="5"><b id="cv">5</b></label><label>Rows <input id="rows" type="range" min="2" max="20" value="5"><b id="rv">5</b></label><label>Opacity <input id="op" type="range" min="8" max="65" value="20"><b id="ov">20%</b></label><button id="thirds">Rule of thirds</button><button id="hide">Hide grid</button></div><div class="crop" id="crop"><canvas id="canvas"></canvas><div class="shade"></div><div class="sel" id="sel"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div></div><div class="cropbar hidden" id="cropbar"><button data-r="free">Free</button><button data-r="1">1:1</button><button data-r="1.25">5:4</button><button data-r=".8">4:5</button><button data-r="1.5">3:2</button><button data-r="1.7778">16:9</button><button id="center">Center</button><button id="cancel">Cancel</button><button id="apply" class="primary">Apply crop</button></div><div class="status" id="status">Upload an image to begin.</div></div></div><script>const $=id=>document.getElementById(id),img=$("img"),file=$("file"),grid=$("grid"),crop=$("crop"),canvas=$("canvas"),ctx=canvas.getContext("2d"),sel=$("sel"),cropbar=$("cropbar"),status=$("status"),gridControls=$("gridControls");let original="",cropState={x:.1,y:.1,w:.8,h:.8,ratio:null},drag=null,active=false;file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{original=r.result;img.onload=()=>{status.textContent="Image loaded. Try Grid or Crop.";drawGrid()};img.src=r.result};r.readAsDataURL(f)};function drawGrid(){const c=+$('cols').value,r=+$('rows').value,o=+$('op').value/100;grid.style.display="block";grid.style.backgroundImage=`linear-gradient(to right,rgba(255,255,255,${o}) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,${o}) 1px,transparent 1px)`;grid.style.backgroundSize=`${100/c}% ${100/r}%`;$('cv').textContent=c;$('rv').textContent=r;$('ov').textContent=Math.round(o*100)+"%"}['cols','rows','op'].forEach(id=>$(id).oninput=drawGrid);$('hide').onclick=()=>grid.style.display='none';$('thirds').onclick=()=>{$('cols').value=3;$('rows').value=3;drawGrid()};$('gridBtn').onclick=()=>{gridControls.classList.remove('hidden');grid.style.display='block';drawGrid();crop.style.display='none';cropbar.classList.add('hidden')};$('resetBtn').onclick=()=>{if(original){img.src=original;grid.style.display='none';status.textContent='Reset.'}};function startCrop(){if(!img.src){status.textContent='Upload an image first.';return}grid.style.display='none';gridControls.classList.add('hidden');crop.style.display='block';cropbar.classList.remove('hidden');const cimg=new Image();cimg.onload=()=>{const max=Math.min(crop.clientWidth||900,900),s=Math.min(1,max/cimg.naturalWidth);canvas.width=Math.round(cimg.naturalWidth*s);canvas.height=Math.round(cimg.naturalHeight*s);ctx.drawImage(cimg,0,0,canvas.width,canvas.height);cropState={x:.1,y:.1,w:.8,h:.8,ratio:null};renderCrop()};cimg.src=img.src;active=true}function renderCrop(){sel.style.left=cropState.x*canvas.clientWidth+'px';sel.style.top=cropState.y*canvas.clientHeight+'px';sel.style.width=cropState.w*canvas.clientWidth+'px';sel.style.height=cropState.h*canvas.clientHeight+'px';status.textContent=cropState.ratio?'Locked ratio: '+cropState.ratio:'Free crop'}$('cropBtn').onclick=startCrop;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const v=b.dataset.r;cropState.ratio=v==='free'?null:+v;renderCrop()});$('center').onclick=()=>{cropState.x=(1-cropState.w)/2;cropState.y=(1-cropState.h)/2;renderCrop()};$('cancel').onclick=()=>{crop.style.display='none';cropbar.classList.add('hidden');gridControls.classList.remove('hidden');status.textContent='Crop cancelled.'};function point(e){const p=e.touches?e.touches[0]:e;const r=canvas.getBoundingClientRect();return{x:(p.clientX-r.left)/r.width,y:(p.clientY-r.top)/r.height}}sel.addEventListener('pointerdown',e=>{e.preventDefault();const r=sel.getBoundingClientRect(),p=e;const near=e.target.tagName==='I';drag={mode:near?e.target.className.split(' ')[0]:'move',start:point(p),state:{...cropState}};sel.setPointerCapture(e.pointerId)});sel.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y,s=drag.state;if(drag.mode==='move'){cropState.x=Math.max(0,Math.min(1-s.w,s.x+dx));cropState.y=Math.max(0,Math.min(1-s.h,s.y+dy))}else{let x=s.x,y=s.y,w=s.w,h=s.h,m=drag.mode;if(m==='br'){w=Math.max(.08,Math.min(1-x,s.w+dx));h=Math.max(.08,Math.min(1-y,s.h+dy))}if(m==='tl'){x=Math.max(0,Math.min(s.x+s.w-.08,s.x+dx));y=Math.max(0,Math.min(s.y+s.h-.08,s.y+dy));w=s.x+s.w-x;h=s.y+s.h-y}if(m==='tr'){y=Math.max(0,Math.min(s.y+s.h-.08,s.y+dy));w=Math.max(.08,Math.min(1-s.x,s.w+dx));h=s.y+s.h-y}if(m==='bl'){x=Math.max(0,Math.min(s.x+s.w-.08,s.x+dx));w=s.x+s.w-x;h=Math.max(.08,Math.min(1-s.y,s.h+dy))}if(s.ratio){const ar=s.ratio;h=w/ar;if(y+h>1)h=1-y;if(x+w>1)w=1-x}cropState={x,y,w,h}}renderCrop()});sel.addEventListener('pointerup',()=>drag=null);$('apply').onclick=()=>{const sx=Math.round(cropState.x*canvas.width),sy=Math.round(cropState.y*canvas.height),sw=Math.round(cropState.w*canvas.width),sh=Math.round(cropState.h*canvas.height);const out=document.createElement('canvas');out.width=sw;out.height=sh;out.getContext('2d').drawImage(canvas,sx,sy,sw,sh,0,0,sw,sh);img.src=out.toDataURL('image/jpeg',.94);crop.style.display='none';cropbar.classList.add('hidden');gridControls.classList.remove('hidden');status.textContent='Crop applied.'};</script></body></html>

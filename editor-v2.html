<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLORLESS V2</title><link rel="stylesheet" href="css/app.css"></head><body><header class="app-header"><div class="brand"><img src="IMG_5615.jpeg" alt="">COLORLESS</div><button onclick="location.href='index.html'">Home</button></header><main class="page"><section class="hero"><h1>Painting reference, simplified.</h1><p>Upload a photo, identify colors, build a palette, check values, simplify the image and add an artist grid.</p><label class="upload"><input id="file" type="file" accept="image/*">📷 Choose reference photo</label></section><section class="card"><div class="toolbar"><button onclick="mode('color')">🎨 Color ID</button><button onclick="mode('gray')">◐ Grayscale</button><button onclick="mode('value')">◑ Value</button><button onclick="toggleGrid()">▦ Grid</button><button onclick="extract()">✨ Palette</button><button onclick="simplify(5)">5 Colors</button><button onclick="simplify(10)">10 Colors</button><button onclick="resetImage()">Reset</button><button onclick="download()" class="primary">⬇ Export</button></div><div class="editor-stage" id="stage"><img id="img" alt="Reference"></div><div class="panel"><div class="row"><div class="control"><label>Vertical divisions</label><input id="v" type="number" min="2" max="100" value="10" onchange="drawGrid()"></div><div class="control"><label>Horizontal divisions</label><input id="h" type="number" min="2" max="100" value="10" onchange="drawGrid()"></div><div class="control"><label>Grid labels</label><select id="labels" onchange="drawGrid()"><option value="yes">A1, B1…</option><option value="no">Numbers only</option></select></div></div></div><div id="info" class="panel" hidden></div><div id="palette" class="panel" hidden></div></section></main><script>
const img=document.querySelector('#img'),stage=document.querySelector('#stage');let original='',grid=false,modeName='color';document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{original=r.result;img.src=original;img.onload=()=>{} };r.readAsDataURL(f)};
function mode(m){modeName=m;img.style.filter=m==='gray'?'grayscale(1)':m==='value'?'grayscale(1) contrast(1.8) brightness(1.1)':'none'}
function resetImage(){if(original){img.src=original;mode('color')}}
function toggleGrid(){grid=!grid;let g=document.querySelector('#grid');if(!grid){g?.remove();return}drawGrid()}
function drawGrid(){if(!grid||!img.src)return;document.querySelector('#grid')?.remove();const c=document.createElement('canvas');c.id='grid';c.className='grid-layer';c.width=stage.clientWidth;c.height=stage.clientHeight;stage.appendChild(c);const x=c.getContext('2d'),v=+document.querySelector('#v').value,h=+document.querySelector('#h').value; x.strokeStyle='rgba(255,255,255,.65)';x.fillStyle='rgba(255,255,255,.85)';x.font='11px Arial';for(let i=1;i<v;i++){let px=c.width*i/v;x.beginPath();x.moveTo(px,0);x.lineTo(px,c.height);x.stroke()}for(let j=1;j<h;j++){let py=c.height*j/h;x.beginPath();x.moveTo(0,py);x.lineTo(c.width,py);x.stroke()}for(let j=0;j<h;j++)for(let i=0;i<v;i++){let label=document.querySelector('#labels').value==='yes'?String.fromCharCode(65+(i%26))+(j+1):(j+1)+'.'+(i+1);x.fillText(label,i*c.width/v+3,j*c.height/h+12)}}
function extract(){if(!img.src)return;const c=document.createElement('canvas'),x=c.getContext('2d');c.width=120;c.height=Math.max(1,Math.round(120*(img.naturalHeight/img.naturalWidth)));x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data,b={};for(let i=0;i<d.length;i+=20){let r=Math.round(d[i]/32)*32,g=Math.round(d[i+1]/32)*32,bb=Math.round(d[i+2]/32)*32,k=r+','+g+','+bb;b[k]=(b[k]||0)+1}const colors=Object.keys(b).sort((a,z)=>b[z]-b[a]).slice(0,8);document.querySelector('#palette').hidden=false;document.querySelector('#palette').innerHTML='<h3>Dominant palette</h3><div class="palette">'+colors.map(k=>{let q=k.split(',').map(Number),hex='#'+q.map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase();return '<button class="swatch" title="'+hex+'" style="background:'+hex+'" onclick="navigator.clipboard?.writeText(\''+hex+'\')"></button>'}).join('')+'</div><p>Tap a swatch to copy its HEX value.</p>'}
function simplify(n){if(!img.src)return;const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height),step=Math.max(1,Math.floor(256/n));for(let i=0;i<d.data.length;i+=4){d.data[i]=Math.floor(d.data[i]/step)*step;d.data[i+1]=Math.floor(d.data[i+1]/step)*step;d.data[i+2]=Math.floor(d.data[i+2]/step)*step}x.putImageData(d,0,0);img.src=c.toDataURL('image/png');mode('color')}
img.addEventListener('click',e=>{if(!img.src)return;const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const r=img.getBoundingClientRect(),px=Math.floor((e.clientX-r.left)*c.width/r.width),py=Math.floor((e.clientY-r.top)*c.height/r.height),d=x.getImageData(px,py,1,1).data,hex='#'+[d[0],d[1],d[2]].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase();const lum=Math.round(.2126*d[0]+.7152*d[1]+.0722*d[2]);const inf=document.querySelector('#info');inf.hidden=false;inf.innerHTML='<div class="result-grid"><div class="result-item"><div class="value-preview" style="background:'+hex+'"></div><b>'+hex+'</b><small>HEX</small></div><div class="result-item"><b>'+d[0]+', '+d[1]+', '+d[2]+'</b><small>RGB</small></div><div class="result-item"><b>'+lum+'/255</b><small>Value</small></div></div><button onclick="navigator.clipboard?.writeText(\''+hex+'\')">Copy HEX</button>'});
function download(){if(!img.src)return;const a=document.createElement('a');a.href=img.src;a.download='colorless-reference.png';a.click()};window.addEventListener('resize',()=>{if(grid)drawGrid()});
</script></body></html>

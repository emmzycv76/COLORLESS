<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>COLORLESS — Artist Workspace</title><link rel="stylesheet" href="css/app.css"></head><body>
<header class="app-header"><div class="brand"><img src="IMG_5615.jpeg" alt="">COLORLESS</div><div class="top-actions"><button id="undoBtn" title="Undo" disabled>↶</button><button id="redoBtn" title="Redo" disabled>↷</button><button onclick="location.href='index.html'">Home</button></div></header>
<main class="page"><section class="editor-workspace">
<div class="workspace-title"><div><strong>Artist Workspace</strong><span id="status">Ready</span></div><button id="focusBtn">Focus</button></div>
<label class="upload compact"><input id="file" type="file" accept="image/*">📷 Choose reference photo</label>
<div class="tool-strip-wrap"><div class="tool-strip" id="toolStrip"><button data-tool="color">🎨 Color ID</button><button data-tool="grid">▦ Grid</button><button data-tool="crop">✂ Crop</button><button data-tool="palette">✨ Palette</button><button data-tool="gray">◐ Grayscale</button><button data-tool="value">◑ Value</button><button data-tool="simplify">◒ Simplify</button><button data-tool="reset">Reset</button><button data-tool="export" class="primary">⬇ Export</button></div></div>
<div class="editor-stage" id="stage"><div id="emptyState">Choose a reference photo to begin</div><img id="img" alt="Reference" draggable="false"></div>
<section id="controls" class="panel controls-panel" hidden></section><section id="info" class="panel" hidden></section><section id="palette" class="panel" hidden></section>
</section></main>
<script src="js/color.js"></script><script>
const img=document.querySelector('#img'),stage=document.querySelector('#stage'),controls=document.querySelector('#controls'),info=document.querySelector('#info'),palette=document.querySelector('#palette');let original='',grid=false,modeName='color',history=[],future=[],cropOverlay=null;
const status=t=>document.querySelector('#status').textContent=t;
function snapshot(){return{src:img.src,filter:img.style.filter,grid:JSON.parse(JSON.stringify({on:grid,v:document.querySelector('#v')?.value||10,h:document.querySelector('#h')?.value||10,opacity:document.querySelector('#opacity')?.value||24,labels:document.querySelector('#labels')?.value||'yes'}))}}
function pushHistory(){if(!img.src)return;history.push(snapshot());if(history.length>30)history.shift();future=[];updateHistory()}
function updateHistory(){undoBtn.disabled=history.length<2;redoBtn.disabled=future.length===0}
function restore(s){img.src=s.src;img.style.filter=s.filter;grid=s.grid.on;controls.hidden=false;controls.innerHTML=gridControls(s.grid);if(grid)drawGrid();else document.querySelector('#grid')?.remove();updateHistory()}
undoBtn.onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(history[history.length-1])};redoBtn.onclick=()=>{if(!future.length)return;const s=future.pop();history.push(s);restore(s)};
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{original=r.result;img.onload=()=>{document.querySelector('#emptyState').hidden=true;history=[snapshot()];future=[];updateHistory();status('Reference loaded')};img.src=original};r.readAsDataURL(f)};
function mode(m){if(!img.src)return;pushHistory();modeName=m;img.style.filter=m==='gray'?'grayscale(1)':m==='value'?'grayscale(1) contrast(1.65) brightness(1.05)':'none';status(m==='color'?'Color ID':m==='gray'?'Grayscale':'Value view')}
function resetImage(){if(!original)return;pushHistory();img.src=original;img.style.filter='none';grid=false;document.querySelector('#grid')?.remove();status('Reset to original')}
function gridControls(g={}){return `<div class="row"><div class="control"><label>Columns</label><input id="v" type="number" min="2" max="60" value="${g.v||10}"></div><div class="control"><label>Rows</label><input id="h" type="number" min="2" max="60" value="${g.h||10}"></div><div class="control"><label>Line opacity</label><input id="opacity" type="range" min="5" max="45" value="${g.opacity||24}"></div><div class="control"><label>Labels</label><select id="labels"><option value="yes" ${g.labels!=='no'?'selected':''}>A1, B1…</option><option value="no" ${g.labels==='no'?'selected':''}>Numbers only</option></select></div></div><p class="hint">Keep the grid subtle so the reference remains the focus.</p>`}
function toggleGrid(){if(!img.src)return;pushHistory();grid=!grid;controls.hidden=false;controls.innerHTML=gridControls();['v','h','opacity','labels'].forEach(id=>document.querySelector('#'+id)?.addEventListener('input',drawGrid));if(grid)drawGrid();else document.querySelector('#grid')?.remove();status(grid?'Grid on':'Grid off')}
function drawGrid(){if(!grid||!img.src)return;document.querySelector('#grid')?.remove();const c=document.createElement('canvas');c.id='grid';c.className='grid-layer';c.width=stage.clientWidth;c.height=stage.clientHeight;stage.appendChild(c);const x=c.getContext('2d'),v=+document.querySelector('#v').value,h=+document.querySelector('#h').value,op=(+document.querySelector('#opacity').value)/100;x.strokeStyle=`rgba(255,255,255,${op})`;x.fillStyle=`rgba(255,255,255,${Math.min(op+.08,.35)})`;x.lineWidth=1;x.font='10px Arial';for(let i=1;i<v;i++){let px=c.width*i/v;x.beginPath();x.moveTo(px,0);x.lineTo(px,c.height);x.stroke()}for(let j=1;j<h;j++){let py=c.height*j/h;x.beginPath();x.moveTo(0,py);x.lineTo(c.width,py);x.stroke()}for(let j=0;j<h;j++)for(let i=0;i<v;i++){let label=document.querySelector('#labels').value==='yes'?String.fromCharCode(65+(i%26))+(j+1):(j+1)+'.'+(i+1);x.fillText(label,i*c.width/v+3,j*c.height/h+11)}}
function colorPick(e){if(!img.src)return;const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const r=img.getBoundingClientRect(),px=Math.max(0,Math.min(c.width-1,Math.floor((e.clientX-r.left)*c.width/r.width))),py=Math.max(0,Math.min(c.height-1,Math.floor((e.clientY-r.top)*c.height/r.height))),d=x.getImageData(px,py,1,1).data,hex=rgbToHex(d[0],d[1],d[2]),hsl=rgbToHsl(d[0],d[1],d[2]),lum=Math.round(.2126*d[0]+.7152*d[1]+.0722*d[2]);info.hidden=false;info.innerHTML=`<div class="result-grid"><div class="result-item"><div class="value-preview" style="background:${hex}"></div><b>${hex}</b><small>HEX</small></div><div class="result-item"><b>${d[0]}, ${d[1]}, ${d[2]}</b><small>RGB</small></div><div class="result-item"><b>${hsl[0]}°, ${hsl[1]}%, ${hsl[2]}%</b><small>HSL</small></div><div class="result-item"><b>${lum}/255</b><small>Value</small></div></div><div class="row"><button onclick="copyText('${hex}')">Copy HEX</button><button onclick="saveColor({hex:'${hex}',name:colorName(${d[0]},${d[1]},${d[2]})})">Save color</button></div><p class="hint">${colorName(d[0],d[1],d[2])}</p>`;status('Color sampled')}
img.addEventListener('click',e=>{if(modeName==='color')colorPick(e)});
function extract(){if(!img.src)return;const colors=extractPalette(img,8);palette.hidden=false;palette.innerHTML='<h3>Dominant palette</h3><div class="palette">'+colors.map(c=>`<button class="swatch" title="${c.hex} — ${c.name}" style="background:${c.hex}" onclick="copyText('${c.hex}');status('Copied ${c.hex}')"></button>`).join('')+'</div><div class="result-grid">'+colors.map(c=>`<div class="result-item"><div class="value-preview" style="background:${c.hex}"></div><b>${c.hex}</b><small>${c.name}</small></div>`).join('')+'</div>';status('Palette extracted')}
function simplify(n){if(!img.src)return;pushHistory();const c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height),levels=Math.max(2,Math.min(20,n)),step=255/(levels-1);for(let i=0;i<d.data.length;i+=4){d.data[i]=Math.round(d.data[i]/step)*step;d.data[i+1]=Math.round(d.data[i+1]/step)*step;d.data[i+2]=Math.round(d.data[i+2]/step)*step}x.putImageData(d,0,0);img.onload=()=>{drawGrid()};img.src=c.toDataURL('image/png');status(`Simplified to ${n} levels`)}
function openCrop(ratio){if(!img.src)return;closeCrop();cropOverlay=document.createElement('div');cropOverlay.className='crop-overlay';cropOverlay.innerHTML=`<div class="crop-head"><strong>Crop reference</strong><span id="cropSize"></span></div><div class="crop-frame" id="cropFrame"><div class="crop-selection" id="cropSelection"><i class="crop-handle nw"></i><i class="crop-handle ne"></i><i class="crop-handle sw"></i><i class="crop-handle se"></i></div></div><div class="crop-actions"><button id="cropCancel">Cancel</button><button class="primary" id="cropApply">Apply crop</button></div>`;document.body.appendChild(cropOverlay);const frame=cropOverlay.querySelector('#cropFrame'),sel=cropOverlay.querySelector('#cropSelection'),size=cropOverlay.querySelector('#cropSize');let selection,drag=null;const locked=ratio==='free'?null:ratio;function fit(){const w=frame.clientWidth,h=frame.clientHeight;let sw=w*.78,sh=h*.78;if(locked){if(sw/sh>locked)sw=sh*locked;else sh=sw/locked}selection={x:(w-sw)/2,y:(h-sh)/2,w:sw,h:sh};paint()}function paint(){sel.style.left=selection.x+'px';sel.style.top=selection.y+'px';sel.style.width=selection.w+'px';sel.style.height=selection.h+'px';size.textContent=`${Math.round(selection.w)} × ${Math.round(selection.h)}`}function point(e){const r=frame.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}fit();function down(e){e.preventDefault();const handle=e.target.className.includes('crop-handle')?e.target.className.split(' ')[1]:'move';drag={type:handle,start:point(e),base:{...selection}};e.currentTarget.setPointerCapture(e.pointerId)}function move(e){if(!drag)return;const p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y,b=drag.base,w=frame.clientWidth,h=frame.clientHeight;let n={...b};if(drag.type==='move'){n.x=Math.max(0,Math.min(w-b.w,b.x+dx));n.y=Math.max(0,Math.min(h-b.h,b.y+dy))}else{let nw=b.w,nh=b.h,left=b.x,top=b.y;if(drag.type.includes('e'))nw=b.w+dx;if(drag.type.includes('w')){nw=b.w-dx;left=b.x+dx}if(drag.type.includes('s'))nh=b.h+dy;if(drag.type.includes('n')){nh=b.h-dy;top=b.y+dy}if(locked){if(Math.abs(dx)>=Math.abs(dy))nh=nw/locked;else nw=nh*locked;if(drag.type.includes('w'))left=b.x+b.w-nw;if(drag.type.includes('n'))top=b.y+b.h-nh}nw=Math.max(50,Math.min(w-left,nw));nh=Math.max(50,Math.min(h-top,nh));n={x:Math.max(0,left),y:Math.max(0,top),w:nw,h:nh}}selection=n;paint()}sel.addEventListener('pointerdown',down);sel.addEventListener('pointermove',move);sel.addEventListener('pointerup',()=>drag=null);sel.addEventListener('pointercancel',()=>drag=null);cropOverlay.querySelector('#cropCancel').onclick=closeCrop;cropOverlay.querySelector('#cropApply').onclick=()=>{pushHistory();const fr=frame.getBoundingClientRect(),ir=img.getBoundingClientRect(),sx=img.naturalWidth/ir.width,sy=img.naturalHeight/ir.height,left=Math.max(0,(fr.left+selection.x-ir.left)*sx),top=Math.max(0,(fr.top+selection.y-ir.top)*sy),right=Math.min(img.naturalWidth,(fr.left+selection.x+selection.w-ir.left)*sx),bottom=Math.min(img.naturalHeight,(fr.top+selection.y+selection.h-ir.top)*sy),w=Math.max(1,Math.round(right-left)),h=Math.max(1,Math.round(bottom-top)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,left,top,w,h,0,0,w,h);img.onload=()=>{drawGrid();closeCrop()};img.src=c.toDataURL('image/jpeg',.94);status('Reference cropped')};}
function closeCrop(){cropOverlay?.remove();cropOverlay=null}
function openTool(t){if(t==='color'){modeName='color';status('Color ID — tap the image');return}if(t==='grid'){toggleGrid();return}if(t==='crop'){controls.hidden=false;controls.innerHTML='<div class="row">'+['free','1','1.25','0.8','1.5','1.7778'].map((r,i)=>`<button data-ratio="${r}">${['Free','1:1','4:5','5:4','3:2','16:9'][i]}</button>`).join('')+'</div><p class="hint">Drag the crop box or its corner handles. Your reference stays untouched until you apply.</p>';controls.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>openCrop(b.dataset.ratio));return}if(t==='palette'){extract();return}if(t==='gray'){mode('gray');return}if(t==='value'){mode('value');return}if(t==='simplify'){controls.hidden=false;controls.innerHTML='<div class="row">'+[3,5,10,20].map(n=>`<button data-level="${n}">${n} levels</button>`).join('')+'</div>';controls.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>simplify(+b.dataset.level));return}if(t==='reset'){resetImage();return}if(t==='export'){download();return}}
toolStrip.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)openTool(b.dataset.tool)});
toolStrip.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();toolStrip.scrollLeft+=e.deltaY}},{passive:false});
function download(){if(!img.src)return;const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.filter=img.style.filter||'none';x.drawImage(img,0,0);if(grid){const gc=document.querySelector('#grid');if(gc)x.drawImage(gc,0,0,c.width,c.height)}const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='colorless-reference.png';a.click();status('Exported reference')}
focusBtn.onclick=()=>{document.body.classList.toggle('focus-mode');focusBtn.textContent=document.body.classList.contains('focus-mode')?'Exit focus':'Focus'};
window.addEventListener('resize',()=>{if(grid)drawGrid()});
</script></body></html>
